version: "2"

linters:
  default: standard
  enable:
    - bodyclose
    - copyloopvar
    - durationcheck
    - errorlint
    - gocritic
    - gosec
    - misspell
    - nilerr
    - predeclared
    - revive
    - unconvert
    - unparam
    - usestdlibvars
    - wastedassign
  settings:
    gosec:
      excludes:
        # Packet parsers convert bounded uint8/uint16 header fields to int on
        # purpose; every length field is range-checked before use.
        - G115
        # otinv exists to read capture and config files the operator names on
        # the command line, so a variable file path is the feature, not a flaw.
        - G304
    gocritic:
      disabled-checks:
        - ifElseChain
  exclusions:
    rules:
      - path: _test\.go
        linters:
          - errcheck
          - gosec

formatters:
  enable:
    - gofmt
    - goimports
